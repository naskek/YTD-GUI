name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Windows build and smoke test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      YTD_GUI_VERSION: "1.1.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.22.2"

      - name: Build and run smoke tests
        shell: pwsh
        run: .\build_installer.ps1

      - name: Upload CI build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: MiniURLConverter-${{ github.sha }}
          path: |
            dist/mini_url_converter.exe
            installer/Output/MiniURLConverterSetup.exe
          if-no-files-found: error
          retention-days: 14
